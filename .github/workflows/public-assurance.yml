name: Public assurance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-distribution:
    name: Public distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install Python for the locked harness
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install public R dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base r-cran-jsonlite
      - name: Install locked Python dependencies
        run: |
          "$pythonLocation/bin/python" -I -E -s -S -B -m venv agent-harness/.venv
          agent-harness/.venv/bin/python -I -E -s -B -m pip install --no-compile --require-hashes -r agent-harness/requirements.lock
          agent-harness/.venv/bin/python -I -E -s -S -B tools/sanitize_python_environment.py
      - name: Validate the runnable public single-endpoint edition
        run: make public-check

  node-boundaries:
    name: Node and public lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install locked Node dependencies
        working-directory: mcp-server
        run: npm ci --no-audit --no-fund
      - name: Exercise public-safe lifecycle boundaries
        working-directory: mcp-server
        env:
          EXPDESIGN_PYTHON: /usr/bin/python3
          EXPDESIGN_RSCRIPT: /usr/bin/false
        run: npm run test:public-lifecycle

  python-contracts:
    name: Python contracts (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify schema, gate, report, audit, and artifact contracts
        run: |
          "$pythonLocation/bin/python" -I -E -s -S -B agent-harness/tests/test_response_budget.py
          "$pythonLocation/bin/python" -I -E -s -S -B agent-harness/tests/test_audit.py
          "$pythonLocation/bin/python" -I -E -s -S -B agent-harness/tests/test_artifact_download.py
          "$pythonLocation/bin/python" -I -E -s -S -B agent-harness/tests/test_mcp_client.py --public-only

  supply-chain:
    name: Dependencies and credential patterns
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Audit production dependencies
        working-directory: mcp-server
        run: npm audit --omit=dev --audit-level=high
      - name: Scan every reachable Git object for credential patterns
        shell: bash
        run: |
          set -o pipefail
          git rev-list --objects --all \
            | awk '{print $1}' \
            | git cat-file --batch \
            | tools/run-publication-python.sh "$PWD/tools/check_diff_credentials.py"
